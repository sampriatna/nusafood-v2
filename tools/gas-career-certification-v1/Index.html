<!doctype html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--bg:#f6f7f9;--card:#fff;--text:#171717;--muted:#666;--line:#e6e7ea;--ok:#137333;--warn:#b06000;--bad:#b3261e;--brand:#111827}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
    header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;z-index:5;display:flex;gap:12px;align-items:center;justify-content:space-between}
    h1{font-size:18px;margin:0}.muted{color:var(--muted);font-size:12px}.wrap{max-width:1200px;margin:auto;padding:18px}
    nav{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px;cursor:pointer}.tab.active{background:var(--brand);color:#fff}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.metric{font-size:28px;font-weight:700;margin-top:5px}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar input,.toolbar select,input,select,textarea{border:1px solid #d8dbe0;border-radius:9px;padding:9px 10px;background:#fff;font:inherit} textarea{width:100%;min-height:70px}
    button{border:0;border-radius:9px;padding:9px 12px;background:var(--brand);color:#fff;cursor:pointer}button.secondary{background:#fff;color:#111;border:1px solid var(--line)}button.danger{background:var(--bad)}button:disabled{opacity:.5;cursor:not-allowed}
    table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{background:#fafafa;position:sticky;top:58px}
    .pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:11px;background:#fff}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
    .hidden{display:none!important}.drawer,.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20;display:flex;justify-content:flex-end}.drawer .panel{width:min(620px,100%);height:100%;overflow:auto;background:#fff;padding:18px}.modal{justify-content:center;align-items:flex-start;padding:30px 12px;overflow:auto}.modal .panel{width:min(900px,100%);background:#fff;border-radius:14px;padding:18px}
    .close{float:right;background:#fff;color:#111;border:1px solid var(--line)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.section{margin:18px 0}.section h3{margin:0 0 10px;font-size:15px}.big{font-size:22px;font-weight:700}.test{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.test-head{display:flex;justify-content:space-between;gap:10px}.score{width:90px}.statusline{padding:10px 12px;border-radius:10px;background:#f7f7f7;margin:10px 0}.loading{position:fixed;bottom:16px;right:16px;background:#111;color:#fff;padding:10px 13px;border-radius:10px;z-index:99}
    @media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}th{position:static}.hide-mobile{display:none}}
  </style>
</head>
<body>
<header><div><h1>NF3 Career & Certification</h1><div class="muted" id="actor">Memuat…</div></div><nav><button class="tab active" data-view="dashboard">Dashboard</button><button class="tab" data-view="staff">Data Staff</button><button class="tab" data-view="audit">Assessment</button></nav></header>
<div class="wrap">
  <section id="view-dashboard"></section>
  <section id="view-staff" class="hidden"></section>
  <section id="view-audit" class="hidden"></section>
</div>
<div id="drawer" class="drawer hidden"><div class="panel"><button class="close" onclick="closeDrawer()">Tutup</button><div id="drawerBody"></div></div></div>
<div id="modal" class="modal hidden"><div class="panel"><button class="close" onclick="closeModal()">Tutup</button><div id="modalBody"></div></div></div>
<div id="loading" class="loading hidden">Memproses…</div>
<script>
let APP={data:null,currentStaff:null,currentAssessment:null};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function gas(fn,...args){showLoading(true);return new Promise((res,rej)=>google.script.run.withSuccessHandler(x=>{showLoading(false);res(x)}).withFailureHandler(e=>{showLoading(false);alert(e.message||e);rej(e)})[fn](...args))}
function showLoading(v){$('#loading').classList.toggle('hidden',!v)}
async function boot(){APP.data=await gas('getBootstrapData');$('#actor').textContent='User: '+APP.data.actor+' • '+APP.data.generatedAt;renderAll()}
function renderAll(){renderDashboard();renderStaff();renderAuditHome()}
function nav(view){document.querySelectorAll('section[id^="view-"]').forEach(x=>x.classList.add('hidden'));$('#view-'+view).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===view))}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>nav(b.dataset.view));
function renderDashboard(){const d=APP.data;$('#view-dashboard').innerHTML=`<div class="grid">
<div class="card"><div class="muted">Total staff aktif</div><div class="metric">${d.stats.total}</div></div>
<div class="card"><div class="muted">Perlu audit/review</div><div class="metric warn">${d.stats.pendingAudit}</div></div>
<div class="card"><div class="muted">Sudah punya certification</div><div class="metric ok">${d.stats.certified}</div></div>
<div class="card"><div class="muted">Part-time</div><div class="metric">${d.stats.pt}</div></div></div>
<div class="card section"><h3>Cara pakai yang benar</h3><p><b>1.</b> Cari staff → lihat level efektif sekarang. <b>2.</b> Jalankan audit level yang diklaim. <b>3.</b> Kalau gagal, audit satu level di bawah. <b>4.</b> Setelah level yang benar PASS, management approve relevel. <b>5.</b> Semua perubahan masuk riwayat.</p><p class="muted">Legacy level tidak sama dengan certified level. GAS ini sengaja tidak menurunkan/menaikkan orang otomatis tanpa approval.</p></div>`}
function renderStaff(){const s=APP.data.staff;$('#view-staff').innerHTML=`<div class="toolbar"><input id="q" placeholder="Cari nama/role/outlet" oninput="filterStaff()"><select id="trackFilter" onchange="filterStaff()"><option value="">Semua track</option>${[...new Set(s.map(x=>x.track).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="typeFilter" onchange="filterStaff()"><option value="">FT + PT</option><option>FT</option><option>PT</option><option>OWNER</option></select></div><div id="staffTable"></div>`;filterStaff()}
function filterStaff(){const q=($('#q')?.value||'').toLowerCase(),t=$('#trackFilter')?.value||'',e=$('#typeFilter')?.value||'';const rows=APP.data.staff.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!t||x.track===t)&&(!e||String(x.employment_type).toUpperCase()===e));$('#staffTable').innerHTML=`<table><thead><tr><th>Nama</th><th>Role</th><th>Level efektif</th><th>Certified</th><th>PT grade</th><th>Status</th></tr></thead><tbody>${rows.map(x=>`<tr onclick="openStaff('${esc(x.staff_id)}')" style="cursor:pointer"><td><b>${esc(x.name)}</b><br><span class="muted">${esc(x.outlet)}</span></td><td>${esc(x.track)}<br><span class="pill">${esc(x.employment_type)}</span></td><td><b>${esc(x.display_level)}</b><br><span class="muted">legacy ${esc(x.legacy_level||x.current_level||'-')}</span></td><td>${esc(x.certified_level||'-')}</td><td>${esc(x.display_pt_grade||'-')}<br><span class="muted">cert ${esc(x.pt_certified_grade||'-')}</span></td><td>${statusPill(x.level_status||x.certification_status)}</td></tr>`).join('')}</tbody></table>`}
function statusPill(s){s=String(s||'');let c=/CERTIFIED/.test(s)?'ok':/PENDING|REVIEW|PROVISIONAL/.test(s)?'warn':'';return `<span class="pill ${c}">${esc(s||'-')}</span>`}
async function openStaff(id){APP.currentStaff=await gas('getStaffDetail',id);renderDrawer(APP.currentStaff);$('#drawer').classList.remove('hidden')}
function closeDrawer(){$('#drawer').classList.add('hidden')}
function closeModal(){$('#modal').classList.add('hidden');APP.currentAssessment=null}
function renderDrawer(d){const s=d.staff;$('#drawerBody').innerHTML=`<h2>${esc(s.name)}</h2><div class="muted">${esc(s.outlet)} • ${esc(s.employment_type)} • ${esc(s.track)}</div>
<div class="section row"><div class="card"><div class="muted">Legacy / mapping awal</div><div class="big">${esc(s.legacy_level||s.current_level||'-')}</div></div><div class="card"><div class="muted">Level efektif sekarang</div><div class="big">${esc(s.display_level)}</div></div><div class="card"><div class="muted">Certified level</div><div class="big ok">${esc(s.certified_level||'Belum')}</div></div><div class="card"><div class="muted">PT grade</div><div class="big">${esc(s.display_pt_grade||'-')}</div><div class="muted">Certified: ${esc(s.pt_certified_grade||'Belum')}</div></div></div>
<div class="statusline">${statusPill(s.level_status)} ${statusPill(s.pt_grade_status)}<br><span class="muted">Next: ${esc(s.next_challenge||'-')}</span></div>
<div class="toolbar"><button onclick="startSuggestedAudit()" ${d.suggestedAudit?'':'disabled'}>Mulai Audit ${esc(d.suggestedAudit||'belum tersedia')}</button><button class="secondary" onclick="openCorrection()">Koreksi Mapping</button><button class="secondary" onclick="editProfile()">Edit Data Staff</button></div>
${approvalBlock(d)}
<div class="section"><h3>Riwayat assessment</h3>${simpleTable(d.assessments,['assessment_id','certification_code','total_weighted_score','result','promotion_gate'])}</div>
<div class="section"><h3>Certification</h3>${simpleTable(d.certifications,['certification_code','test_date','total_score','result','assessor'])}</div>
<div class="section"><h3>Riwayat perubahan level</h3>${simpleTable(d.history,['changed_at','change_type','from_level','to_level','from_pt_grade','to_pt_grade','approved_by','reason'])}</div>`}
function approvalBlock(d){const s=d.staff;let out='';if(s.certified_level&&s.certified_level!==s.display_level)out+=`<div class="card section"><b>Certification tersedia: ${esc(s.certified_level)}</b><p class="muted">Level efektif masih ${esc(s.display_level)}. Management bisa approve relevel.</p><button onclick="approveCertified('${esc(s.certified_level)}','')">Approve Level ${esc(s.certified_level)}</button></div>`;if(s.pt_certified_grade&&s.pt_certified_grade!==s.display_pt_grade)out+=`<div class="card section"><b>PT grade certified: ${esc(s.pt_certified_grade)}</b><p class="muted">PT grade efektif masih ${esc(s.display_pt_grade||'-')}.</p><button onclick="approveCertified('','${esc(s.pt_certified_grade)}')">Approve ${esc(s.pt_certified_grade)}</button></div>`;return out}
function simpleTable(rows,cols){if(!rows||!rows.length)return '<div class="muted">Belum ada.</div>';return `<table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,15).map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
async function startSuggestedAudit(){const s=APP.currentStaff.staff,code=APP.currentStaff.suggestedAudit;if(!code)return;const a=await gas('startAssessment',{staffId:s.staff_id,certificationCode:code,assessor:APP.data.actor});openAssessment(a)}
function openAssessment(a){APP.currentAssessment=a;$('#modalBody').innerHTML=`<h2>Assessment ${esc(a.certificationCode)} — ${esc(a.name)}</h2><div class="muted">${esc(a.assessmentId)}</div><div class="row section"><label>Tanggal tes<input id="testDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Assessor<input id="assessor" value="${esc(APP.data.actor)}"></label></div><div id="testItems">${a.items.map(testHtml).join('')}</div><div class="toolbar"><button onclick="saveAssess(false)">Simpan Draft</button><button onclick="saveAssess(true)">Finalize Assessment</button></div>`;$('#modal').classList.remove('hidden')}
function testHtml(x){return `<div class="test" data-code="${esc(x.item_code)}"><div class="test-head"><div><b>${esc(x.item_code)} — ${esc(x.competency_tested)}</b><div class="muted">${esc(x.category)} • Bobot ${esc(x.weight)} • ${esc(x.test_method)}</div></div><input class="score" type="number" min="0" max="100" placeholder="0-100" value="${esc(x.score_0_100)}"></div><p>${esc(x.pass_standard)}</p><div class="muted">Untuk staff: ${esc(x.staff_explanation)}</div><div class="row"><label>Critical failure<select class="critical"><option value="">Pilih</option><option ${String(x.critical_failure).toUpperCase()==='NO'?'selected':''}>NO</option><option ${String(x.critical_failure).toUpperCase()==='YES'?'selected':''}>YES</option></select></label><label>Evidence / link<input class="evidence" value="${esc(x.evidence_link)}"></label></div><label>Catatan<textarea class="note">${esc(x.note||'')}</textarea></label></div>`}
async function saveAssess(finalize){const a=APP.currentAssessment;const items=[...document.querySelectorAll('.test')].map(el=>({itemCode:el.dataset.code,score:el.querySelector('.score').value,criticalFailure:el.querySelector('.critical').value,evidenceLink:el.querySelector('.evidence').value,note:el.querySelector('.note').value}));const saved=await gas('saveAssessment',{assessmentId:a.assessmentId,testDate:$('#testDate').value,assessor:$('#assessor').value,items});APP.currentAssessment=saved;if(!finalize){alert('Draft tersimpan.');openAssessment(saved);return}const out=await gas('finalizeAssessment',{assessmentId:a.assessmentId,reviewer:$('#assessor').value,assessor:$('#assessor').value});alert(out.recommendation.message);closeModal();await refresh();await openStaff(out.staff.staff.staff_id)}
async function approveCertified(level,pt){const s=APP.currentStaff.staff;const reason=prompt('Alasan approval/relevel (wajib):','Hasil baseline audit dan certification PASS');if(!reason)return;const approvedBy=prompt('Approved by:',APP.data.actor);if(!approvedBy)return;await gas('approveLevelAdjustment',{staffId:s.staff_id,targetLevel:level,targetPtGrade:pt,reason,approvedBy,mode:'CERTIFICATION'});await refresh();await openStaff(s.staff_id)}
async function openCorrection(){const s=APP.currentStaff.staff;const opt=await gas('getLevelOptions',s.staff_id);let choices=opt.levels.map(x=>x.level_code).join(', ');if(s.is_pt)choices+=' | PT: '+opt.ptGrades.map(x=>x.pt_grade).join(', ');const target=prompt('Koreksi mapping. Pilihan role level: '+choices+'\nIsi kode target (contoh S2/K4/B2/PT2):',s.display_level);if(!target)return;const reason=prompt('Alasan koreksi mapping (wajib). Ini bukan certification:');if(!reason)return;const approvedBy=prompt('Approved by:',APP.data.actor);if(!approvedBy)return;const isPt=/^PT/.test(target.toUpperCase());await gas('approveLevelAdjustment',{staffId:s.staff_id,targetLevel:isPt?'':target,targetPtGrade:isPt?target:'',reason,approvedBy,mode:'MAPPING_CORRECTION'});await refresh();await openStaff(s.staff_id)}
function editProfile(){const s=APP.currentStaff.staff;$('#modalBody').innerHTML=`<h2>Edit Data Staff</h2><div class="row"><label>Nama<input id="eName" value="${esc(s.name)}"></label><label>Outlet<input id="eOutlet" value="${esc(s.outlet)}"></label><label>Track<input id="eTrack" value="${esc(s.track)}"></label><label>Employment<select id="eEmployment"><option ${s.employment_type==='FT'?'selected':''}>FT</option><option ${s.employment_type==='PT'?'selected':''}>PT</option><option ${s.employment_type==='OWNER'?'selected':''}>OWNER</option></select></label></div><label>Catatan management<textarea id="eNote">${esc(s.management_note||'')}</textarea></label><button onclick="saveProfile()">Simpan</button>`;$('#modal').classList.remove('hidden')}
async function saveProfile(){const s=APP.currentStaff.staff;await gas('saveStaffProfile',{staffId:s.staff_id,name:$('#eName').value,outlet:$('#eOutlet').value,track:$('#eTrack').value,employment_type:$('#eEmployment').value,management_note:$('#eNote').value,reason:'Edited from Web App'});closeModal();await refresh();await openStaff(s.staff_id)}
function renderAuditHome(){const rows=APP.data.staff.filter(x=>/PENDING|REVIEW|PROVISIONAL/.test(String(x.level_status||'')+' '+String(x.pt_grade_status||'')));$('#view-audit').innerHTML=`<div class="card"><h3>Queue audit/review</h3><p class="muted">Klik nama untuk mulai dari level/grade yang sekarang diklaim. Kalau gagal, sistem menyarankan audit level bawah, bukan langsung menurunkan tanpa bukti.</p></div>${simpleTable(rows.map(x=>({name:x.name,track:x.track,effective:x.display_level,pt:x.display_pt_grade,status:x.level_status,next:x.next_challenge})),['name','track','effective','pt','status','next'])}`}
async function refresh(){APP.data=await gas('getBootstrapData');renderAll()}
boot();
</script>
</body>
</html>
